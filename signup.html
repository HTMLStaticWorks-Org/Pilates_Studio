<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f4e4b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Create Account | FORME Portal</title>
</head>

<body class="auth-page" id="top">
    <main>
        <section class="auth-shell">
            <div class="auth-image"></div>
            <form class="auth-card" data-demo-form data-feedback="Account created successfully. Welcome to FORME.">
                <div class="auth-top"><a class="auth-brand" href="index.html" aria-label="FORME home page"><img
                            class="brand-logo auth-brand-logo logo-light" src="Plum and Gold Pilates Studio Logo.png"
                            alt="FORME Pilates Studio"><img class="brand-logo auth-brand-logo logo-dark"
                            src="logo-dark-mode.png" alt="FORME Pilates Studio"></a>
                    <div class="auth-utils" aria-label="Display settings"><button
                            class="util-btn theme-toggle auth-theme-toggle" type="button"
                            aria-label="Switch to dark theme" aria-pressed="false"><svg viewBox="0 0 24 24" width="16"
                                height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                            </svg></button><button class="util-btn rtl-toggle auth-rtl-toggle" type="button"
                            aria-label="Switch layout to right-to-left" aria-pressed="false">RTL</button></div>
                </div>
                <p class="eyebrow">JOIN THE STUDIO</p>
                <h1>Start your<br><em>practice.</em></h1><label for="signup-name">Full name</label><input
                    id="signup-name" required placeholder="Your name"><label for="signup-email">Email
                    address</label><input id="signup-email" type="email" required placeholder="you@example.com"><label
                    for="signup-pass">Create password</label>
                <div class="password-field"><input id="signup-pass" type="password" minlength="8" required
                        placeholder="At least 8 characters"><button class="password-toggle" type="button"
                        data-password-toggle="signup-pass" aria-label="Show password" aria-pressed="false"><svg
                            viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg></button></div><label class="checkline"><input type="checkbox" required> I agree to the
                    studio terms and privacy policy.</label><button class="button button-plum" type="submit">Create
                    account</button>
                <div class="auth-divider"><span>or continue with</span></div>

                <div class="auth-social" aria-label="Social sign-up options">

                    <!-- Google -->
                    <button class="auth-social-btn" type="button" data-inline-note="Google sign-up selected."
                        aria-label="Continue with Google">

                        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>

                        <span>Google</span>
                    </button>

                    <!-- Apple -->
                    <button class="auth-social-btn" type="button" data-inline-note="Apple sign-up selected."
                        aria-label="Continue with Apple">

                        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
                            <path
                                d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.6-2.2.43-3.06-.35C2.5 14.94 3.24 6.7 9.4 6.4c1.5.08 2.55.83 3.44.9 1.33-.27 2.6-1.04 4.03-.94 1.72.14 3.02.82 3.9 2.05-3.55 2.13-2.71 6.8.56 8.11-.65 1.72-1.49 3.42-2.28 4.76zM12.03 6.3c-.17-2.55 1.9-4.65 4.28-4.86.33 2.95-2.68 5.16-4.28 4.86z" />
                        </svg>

                        <span>Apple</span>
                    </button>

                </div>

                <p class="form-feedback" role="status" aria-live="polite"></p>
                <p class="auth-switch">Already a member? <a href="login.html">Sign in</a></p>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
